import me.modmuss50.mpp.ReleaseType

plugins {
    id "dev.architectury.loom-no-remap"
    id "me.modmuss50.mod-publish-plugin"
}

base {
    archivesName = "${rootProject.archives_base_name}-fabric"
}

sourceSets {
    main {
        java.srcDir rootProject.file("common/src/main/java")
        resources.srcDirs(
                rootProject.file("common/src/main/resources"),
                rootProject.file("common/src/generated/resources")
        )
    }
}

fabricApi {
    configureDataGeneration {
        client = true
        outputDirectory = rootProject.file("common/src/generated/resources")
    }
    configureTests {
        enableGameTests = false
        enableClientGameTests = true
        modId = "theatrical"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    implementation "dev.architectury:architectury-fabric:${rootProject.architectury_version}"
    implementation("com.github.westernbear:lumina:v1.0.7-fabric.1") { transitive = false }
    compileOnly("maven.modrinth:iris:1.11.2+26.2-fabric") { transitive = false }

    implementation "ch.bildspur:artnet4j:${rootProject.artnet4j_version}"
    include "ch.bildspur:artnet4j:${rootProject.artnet4j_version}"

    implementation "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"
    include "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test") {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = "${rootProject.archives_base_name}-fabric"
            from components.java
        }
    }

    repositories {
        maven {
            name = "RushMaven"
            url = uri("https://mvn.imabad.dev/repository/maven-releases/")
            credentials {
                username = project.findProperty("nexusUsername") ?: System.getenv("NEXUS_USERNAME")
                password = project.findProperty("nexusPassword") ?: System.getenv("NEXUS_PASSWORD")
            }
        }
    }
}

publishMods {
    file = tasks.jar.archiveFile
    changelog = rootProject.file("CHANGELOG.md").text
    type = ReleaseType.of(project.release_type)
    modLoaders.add("fabric")
    displayName = "Theatrical-fabric-${project.version}"

    curseforge {
        projectId = project.curseforge_id
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(project.minecraft_version)
        client = true
        server = true
        requires("fabric-api")
        requires("architectury-api")
    }
    modrinth {
        projectId = project.modrinth_id
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(project.minecraft_version)
        requires("fabric-api")
        requires("architectury-api")
    }
    github {
        repository = "westernbear/Theatrical"
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        commitish = providers.environmentVariable("GITHUB_REF_NAME").orElse("main")
    }
}
